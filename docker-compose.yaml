services:
  user-db:
    image: postgres:16-alpine
    container_name: messenger-user-db
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB}
    ports:
      - "5431:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${USERS_DB_USER} -d $${USERS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - messenger-net

  chat-db:
    image: postgres:16-alpine
    container_name: messenger-chat-db
    environment:
      POSTGRES_USER: ${CHAT_DB_USER}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
      POSTGRES_DB: ${CHAT_DB}
    ports:
      - "5432:5432"
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${CHAT_DB_USER} -d $${CHAT_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - messenger-net
  
  user-db-migrations:
    image: migrate/migrate
    container_name: messenger-user-db-migrations
    volumes:
      - ./apps/user-service/migrations:/migrations
    command: -path=/migrations -database="${USERS_DB_URL}" up
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - messenger-net
  chat-db-migrations:
    image: migrate/migrate
    container_name: messenger-chat-db-migrations
    volumes:
      - ./apps/chat-service/migrations:/migrations
    command: -path=/migrations -database="${CHAT_DB_URL}" up
    depends_on:
      chat-db:
        condition: service_healthy
    networks:
      - messenger-net
      
  redis-db:
    image: redis:7-alpine
    container_name: messenger-redis-db
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - messenger-net

  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - chat-service
      - ws-gateway
    networks:
      - messenger-net
  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: messenger-user-service
    environment:
      DATABASE_URL: ${USERS_DB_URL}
      REDIS_HOST: "redis-db"
      REDIS_PORT: "6379"
    ports:
      - "8081:8080"
    depends_on:
      user-db-migrations:
        condition: service_completed_successfully
      redis-db:
        condition: service_started
    networks:
      - messenger-net

  chat-service:
    build:
      context: .
      dockerfile: apps/chat-service/Dockerfile
    container_name: messenger-chat-service
    environment:
      DATABASE_URL: ${CHAT_DB_URL}
      REDIS_HOST: "redis-db"
      REDIS_PORT: "6379"
    ports:
      - "8082:8080"
    depends_on:
      chat-db-migrations:
        condition: service_completed_successfully
      redis-db:
        condition: service_started
    networks:
      - messenger-net

  ws-gateway:
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    container_name: messenger-ws-gateway
    environment:
      REDIS_HOST: "redis-db"
      REDIS_PORT: "6379"
    ports:
      - "8080:8080"
    depends_on:
      redis-db:
        condition: service_started
    networks:
      - messenger-net

volumes:
  user_db_data:
  chat_db_data:
  redisdata:

networks:
  messenger-net:
    driver: bridge